name = "pocket-agent-app"
main = "src/api-server/index.ts"
compatibility_date = "2026-06-08"

[assets]
not_found_handling = "single-page-application"

run_worker_first = [
  "/health",
  "/health/*",
  "/status",
  "/status/*",
  "/auth",
  "/auth/*",
  "/me",
  "/me/*",
  "/chat",
  "/chat/*",
  "/settings",
  "/settings/*",
]

[vars]
ENVIRONMENT = "development"
AUTH_MODE = "none"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
POCKET_NODE_URL = "http://127.0.0.1:8787"

# Production — set secrets before first deploy (see docs/DEPLOYMENT.md):
#   wrangler secret put GOOGLE_CLIENT_ID --env production
#   wrangler secret put POCKET_NODE_URL --env production
#   wrangler secret put ALLOWED_ORIGINS --env production
[env.production]
name = "pocket-agent-app"
vars = { ENVIRONMENT = "production" }

[env.staging]
name = "pocket-agent-app-staging"
vars = { ENVIRONMENT = "staging" }
